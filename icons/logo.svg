<svg xmlns="http://www.w3.org/2000/svg" width="112" height="56" viewBox="0 0 448 224">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&amp;display=swap');
      
      .text-title {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 76px;
        fill: #2B2B2B;
      }
      
      .text-subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #555555;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Графическая часть (Щит и Ель) -->
  <g stroke="#2D6A4F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Щит -->
    <path d="M 45 55 L 80 40 L 115 55 V 120 Q 115 165 80 190 Q 45 165 45 120 Z" />
    
    <!-- Ствол ели -->
    <path d="M 80 55 V 190" />
    
    <!-- Левые ветви (замкнутые контуры как на оригинале) -->
    <path d="M 80 70 Q 60 85 60 90 Q 70 85 80 80" />
    <path d="M 80 100 Q 50 120 52 125 Q 65 120 80 110" />
    <path d="M 80 130 Q 52 155 54 160 Q 65 155 80 140" />
    
    <!-- Правые ветви (зеркальное отражение) -->
    <path d="M 80 70 Q 100 85 100 90 Q 90 85 80 80" />
    <path d="M 80 100 Q 110 120 108 125 Q 95 120 80 110" />
    <path d="M 80 130 Q 108 155 106 160 Q 95 155 80 140" />
    
  </g>

  <!-- Текстовая часть -->
  <text x="145" y="115" class="text-title">Уручье</text>
  <text x="150" y="155" class="text-subtitle">Медицинский Спа-Курорт</text>

</svg>
